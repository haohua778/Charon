<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Charon Review Console</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1f2430; --muted: #6b7280; --line: #e3e6ea;
    --accent: #2f5fd0; --low: #fff3c4; --medium: #ffd6a5; --high: #ffb3b3; --code: #dbeafe;
    --ok: #1d8a4a; --warn: #b45309; --bad: #b91c1c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; color: var(--ink); background: var(--bg); }
  header { padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 14px; }
  header h1 { font-size: 17px; margin: 0; }
  header small { color: var(--muted); }
  main { display: grid; grid-template-columns: 400px 1fr; gap: 16px; padding: 16px 20px; min-height: calc(100vh - 50px); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
  .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 10px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-top: 10px; }
  textarea { width: 100%; height: 300px; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; padding: 8px; border: 1px solid var(--line); border-radius: 6px; resize: vertical; }
  select, input[type=number] { padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
  .row label { margin: 0; display: flex; align-items: center; gap: 4px; }
  button { padding: 7px 12px; border-radius: 6px; border: 1px solid var(--line); background: #fff; font: inherit; cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  .hint { font-size: 12px; color: var(--muted); }
  .hint.bad { color: var(--bad); }
  .status { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 12px; margin-bottom: 10px; }
  .status b { font-weight: 600; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; border: 1px solid transparent; }
  .badge.live { background: #dcfce7; color: var(--ok); }
  .badge.offline_fake { background: #fef3c7; color: var(--warn); }
  .badge.complete { background: #dcfce7; color: var(--ok); }
  .badge.partial { background: #fef3c7; color: var(--warn); }
  .badge.failed { background: #fee2e2; color: var(--bad); }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
  .tabs button { border: none; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 6px 10px; }
  .tabs button.active { border-bottom-color: var(--accent); color: var(--accent); font-weight: 600; }
  .tab { display: none; } .tab.active { display: block; }
  pre.report { white-space: pre-wrap; word-wrap: break-word; font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; margin: 0; }
  mark { padding: 1px 0; border-radius: 2px; cursor: pointer; }
  mark.sev-low { background: var(--low); } mark.sev-medium { background: var(--medium); } mark.sev-high { background: var(--high); }
  mark.pulse { outline: 2px solid var(--accent); }
  .flag { border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; cursor: pointer; }
  .flag.sev-low { border-left-color: #eab308; } .flag.sev-medium { border-left-color: #f97316; } .flag.sev-high { border-left-color: #dc2626; }
  .flag .meta { font-size: 11px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
  .flag .quote { font-family: ui-monospace, Menlo, monospace; font-size: 12px; background: #f3f4f6; padding: 4px 6px; border-radius: 4px; margin-top: 4px; white-space: pre-wrap; }
  .chip { display: inline-block; padding: 0 6px; border-radius: 4px; font-size: 11px; background: #eef0f3; }
  .chip.code { background: var(--code); }
  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  td, th { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: left; vertical-align: top; }
  .records li { list-style: none; padding: 4px 0; border-bottom: 1px dashed var(--line); font-size: 12px; cursor: pointer; }
  .records { padding: 0; margin: 0; max-height: 220px; overflow: auto; }
  .banner { padding: 8px 10px; border-radius: 6px; margin-bottom: 10px; font-size: 12px; }
  .banner.bad { background: #fee2e2; color: var(--bad); } .banner.warn { background: #fef3c7; color: var(--warn); }
  pre.json { font-size: 11px; max-height: 70vh; overflow: auto; background: #f3f4f6; padding: 8px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Charon</h1>
  <small>Architecture B review console. Flags support human review; nothing here approves or rejects a report.</small>
</header>
<main>
  <section class="panel">
    <h2>Input</h2>
    <label>Document (.pdf, .docx, .png, .jpg via MinerU; .md, .txt read directly)
      <input id="file" type="file" accept=".pdf,.docx,.png,.jpg,.jpeg,.md,.markdown,.txt">
    </label>
    <div id="parseInfo" class="hint"></div>
    <label>Report as English Markdown (this exact text is reviewed)
      <textarea id="report" spellcheck="false"></textarea>
    </label>
    <div id="charInfo" class="hint"></div>
    <div class="row">
      <label>Rubric <select id="rubric"><option value="program_evaluation">program_evaluation</option><option value="kpi_comparison">kpi_comparison</option></select></label>
      <label>Variant <select id="variant"><option value="specific">specific</option><option value="vague">vague</option></select></label>
      <label>Runs <input id="runs" type="number" min="1" max="5" value="1" style="width:56px"></label>
    </div>
    <div class="row">
      <label><input id="tools" type="checkbox" checked> calculator tools</label>
      <label><input id="verify" type="checkbox" checked> verification pass</label>
    </div>
    <div class="row" style="margin-top:14px">
      <button id="previewBtn">Preview segmentation (free)</button>
      <button id="reviewBtn" class="primary">Run review</button>
    </div>
    <div id="estimate" class="hint"></div>
    <h2 style="margin-top:18px">Recent records</h2>
    <ul id="records" class="records"></ul>
  </section>

  <section class="panel">
    <h2>Result</h2>
    <div id="banner"></div>
    <div id="status" class="status"><span class="hint">Nothing reviewed yet.</span></div>
    <div class="tabs" id="tabs">
      <button data-tab="text" class="active">Text</button>
      <button data-tab="flags">Flags</button>
      <button data-tab="claims">Claims &amp; evidence</button>
      <button data-tab="runs">Runs &amp; verification</button>
      <button data-tab="json">JSON</button>
    </div>
    <div id="tab-text" class="tab active"></div>
    <div id="tab-flags" class="tab"></div>
    <div id="tab-claims" class="tab"></div>
    <div id="tab-runs" class="tab"></div>
    <div id="tab-json" class="tab"><pre class="json" id="json"></pre></div>
  </section>
</main>

<script>
const REPORT_LIMIT = 30000;
const ASSESSED_DIMENSIONS = 4; // both bundled rubrics have four model-assessed dimensions
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const SEVERITY_RANK = {low: 1, medium: 2, high: 3};
let current = null;
let timer = null;

function updateCharInfo() {
  const n = $('report').value.length;
  const info = $('charInfo');
  info.textContent = `${n.toLocaleString()} / ${REPORT_LIMIT.toLocaleString()} characters`;
  info.className = n > REPORT_LIMIT ? 'hint bad' : 'hint';
  const runs = Number($('runs').value) || 1;
  const verify = $('verify').checked ? ASSESSED_DIMENSIONS : 0;
  $('estimate').textContent = `Estimated model calls: ${2 + runs * ASSESSED_DIMENSIONS + verify} (extraction 1, evidence 1, ${runs} run(s) × ${ASSESSED_DIMENSIONS} dimensions, verification ≤ ${verify}); tool rounds and repairs add more. Live calls are paid.`;
  $('reviewBtn').disabled = n === 0 || n > REPORT_LIMIT;
}
['input', 'change'].forEach((ev) => { $('report').addEventListener(ev, updateCharInfo); $('runs').addEventListener(ev, updateCharInfo); $('verify').addEventListener(ev, updateCharInfo); });

async function api(path, options) {
  const response = await fetch(path, options);
  let body = null;
  try { body = await response.json(); } catch (e) { body = null; }
  return {ok: response.ok, status: response.status, body};
}

function banner(text, kind) {
  $('banner').innerHTML = text ? `<div class="banner ${kind}">${esc(text)}</div>` : '';
}

$('file').addEventListener('change', async () => {
  const file = $('file').files[0];
  if (!file) return;
  $('parseInfo').textContent = `Parsing ${file.name}… (a first MinerU run downloads models and can take minutes)`;
  const result = await api(`/parse?filename=${encodeURIComponent(file.name)}`, {
    method: 'POST', headers: {'Content-Type': 'application/octet-stream'}, body: file,
  });
  if (!result.ok) {
    $('parseInfo').textContent = `Parse failed: ${result.body?.detail?.code || result.status}`;
    $('parseInfo').className = 'hint bad';
    return;
  }
  const doc = result.body;
  $('report').value = doc.markdown;
  $('parseInfo').className = doc.fits_review_limit ? 'hint' : 'hint bad';
  $('parseInfo').textContent = `${doc.filename}: parsed by ${doc.parser}, ${doc.characters.toLocaleString()} characters` +
    (doc.fits_review_limit ? '' : ` — over the ${REPORT_LIMIT.toLocaleString()} limit, trim the text before reviewing`);
  updateCharInfo();
});

$('previewBtn').addEventListener('click', async () => {
  banner('');
  const result = await api('/preview', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({report: $('report').value})});
  if (!result.ok) { banner(`Preview failed: ${result.body?.detail?.code || result.status}`, 'bad'); return; }
  const p = result.body;
  const kinds = {};
  p.units.forEach((u) => { kinds[u.kind] = (kinds[u.kind] || 0) + 1; });
  $('status').innerHTML = `<span><b>Preview</b> (no model call)</span><span>${p.characters.toLocaleString()} characters</span>` +
    Object.entries(kinds).map(([k, v]) => `<span>${v} ${k}</span>`).join('') +
    `<span>${p.targets.filter((t) => t.scope === 'section').length} sections</span>`;
  $('tab-text').innerHTML = `<pre class="report">${esc(p.annotated)}</pre>`;
  $('tab-flags').innerHTML = '<table><tr><th>Unit</th><th>Kind</th><th>Section</th><th>Tags</th><th>Text</th></tr>' +
    p.units.map((u) => `<tr><td>${esc(u.unit_id)}</td><td>${esc(u.kind)}</td><td>${esc(u.section_id)}</td><td>${u.tags.map((t) => `<span class="chip">${esc(t)}</span>`).join(' ')}</td><td>${esc(u.text)}</td></tr>`).join('') + '</table>';
  $('tab-claims').innerHTML = $('tab-runs').innerHTML = '<p class="hint">Run a review to populate this tab.</p>';
  $('json').textContent = JSON.stringify(p, null, 2);
  showTab('text');
});

$('reviewBtn').addEventListener('click', async () => {
  const request = {
    report: $('report').value, rubric_id: $('rubric').value, variant: $('variant').value,
    runs: Number($('runs').value) || 1, tools_enabled: $('tools').checked, verify_enabled: $('verify').checked,
  };
  if (!confirm(`Start a review? ${$('estimate').textContent}`)) return;
  banner('');
  $('reviewBtn').disabled = true;
  const started = performance.now();
  clearInterval(timer);
  timer = setInterval(() => {
    $('status').innerHTML = `<span><b>Running…</b> ${((performance.now() - started) / 1000).toFixed(0)} s. The DAG runs extraction, evidence, ${request.runs} × ${ASSESSED_DIMENSIONS} assessments, then verification; there is no streaming.</span>`;
  }, 500);
  try {
    const result = await api('/review', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(request)});
    clearInterval(timer);
    if (result.ok) {
      render(result.body);
    } else {
      const detail = result.body?.detail || {};
      if (detail.review_id) {
        const record = await api(`/records/${detail.review_id}`);
        if (record.ok) render(record.body, `Review ${detail.status}: ${detail.code}. Showing the persisted record.`);
        else banner(`Review ${detail.status}: ${detail.code} (record ${detail.review_id} not readable)`, 'bad');
      } else {
        banner(`Review failed before a record was written: ${detail.code || result.status}`, 'bad');
        $('status').innerHTML = '';
      }
    }
  } catch (e) {
    clearInterval(timer);
    banner(`Request failed: ${e.message}`, 'bad');
  } finally {
    $('reviewBtn').disabled = false;
    loadRecords();
  }
});

function severityOf(flags) {
  return flags.reduce((best, f) => (SEVERITY_RANK[f.severity] > SEVERITY_RANK[best] ? f.severity : best), 'low');
}

function highlighted(report, flags) {
  const spans = flags.filter((f) => f.target.scope === 'claim');
  const cuts = new Set([0, report.length]);
  spans.forEach((f) => { cuts.add(f.target.start); cuts.add(f.target.end); });
  const points = [...cuts].sort((a, b) => a - b);
  let html = '';
  for (let i = 0; i < points.length - 1; i++) {
    const [s, e] = [points[i], points[i + 1]];
    const covering = spans.filter((f) => f.target.start <= s && f.target.end >= e);
    const text = esc(report.slice(s, e));
    if (!covering.length) { html += text; continue; }
    const ids = covering.map((f) => f.flag_id);
    html += `<mark class="sev-${severityOf(covering)}" data-flags="${ids.join(',')}" title="${esc(covering.map((f) => `${f.flag_id} ${f.check_id}`).join('\n'))}">${text}</mark>`;
  }
  return `<pre class="report">${html}</pre>`;
}

function flagCard(f) {
  const confidence = f.confidence == null ? (f.origin === 'code' ? 'code check' : 'n/a (partial batch)') : `${f.confidence.toFixed(2)} (${f.occurrences}/${f.valid_runs} runs)`;
  const verification = f.verification ? `<div class="meta">verification: <b>${esc(f.verification.label)}</b>` +
    (f.verification.counter.length ? ` · counter: ${f.verification.counter.map((q) => `<span class="chip">${esc(q.unit_id)}</span> ${esc(q.text)}`).join('; ')}` : '') +
    (f.verification.note ? ` · ${esc(f.verification.note)}` : '') + '</div>' : '';
  return `<div class="flag sev-${f.severity}" data-flag="${esc(f.flag_id)}">
    <div class="meta"><b>${esc(f.flag_id)}</b><span class="chip ${f.origin}">${esc(f.origin)}</span><span>${esc(f.severity)}</span><span>${esc(f.dimension)} / ${esc(f.check_id)}</span><span>target ${esc(f.target.target_id)}</span><span>confidence ${esc(confidence)}</span>${f.also_reported_by_model ? '<span>also reported by model</span>' : ''}</div>
    <div>${esc(f.reason)}</div>
    ${f.quote ? `<div class="quote">${esc(f.quote)}</div>` : ''}
    ${f.note ? `<div class="hint">note: ${esc(f.note)}</div>` : ''}
    ${verification}
  </div>`;
}

function render(record, warning) {
  current = record;
  banner(warning || (record.error_code ? `error_code: ${record.error_code}` : ''), record.status === 'complete' ? 'warn' : 'bad');
  const usage = record.usage || {};
  const tokens = usage.input_tokens == null ? 'tokens unknown' : `${usage.input_tokens.toLocaleString()} in / ${usage.output_tokens.toLocaleString()} out`;
  $('status').innerHTML = [
    `<span class="badge ${record.provenance}">${record.provenance}</span>`,
    `<span class="badge ${record.status}">${record.status}</span>`,
    `<span><b>model</b> ${esc(record.model)}</span>`,
    `<span><b>mode</b> ${esc(record.mode)}</span>`,
    `<span><b>runs</b> ${record.valid_runs}/${record.requested_runs} valid</span>`,
    `<span><b>calls</b> ${usage.calls} · ${tokens}</span>`,
    `<span><b>elapsed</b> ${record.elapsed_seconds.toFixed(1)} s</span>`,
    `<span><b>verification</b> ${esc(record.verification_status)}${record.verification_error_code ? ' (' + esc(record.verification_error_code) + ')' : ''}</span>`,
    `<span><b>flags</b> ${record.flags.length}</span>`,
    `<span><b>id</b> ${esc(record.review_id)}</span>`,
  ].join('');
  $('tab-text').innerHTML = highlighted(record.report, record.flags);
  const claimFlags = record.flags.filter((f) => f.target.scope === 'claim');
  const wideFlags = record.flags.filter((f) => f.target.scope !== 'claim');
  $('tab-flags').innerHTML = (record.flags.length ? '' : '<p class="hint">No flags.</p>') +
    (wideFlags.length ? `<h3 style="font-size:13px">Document and section level (${wideFlags.length})</h3>` + wideFlags.map(flagCard).join('') : '') +
    (claimFlags.length ? `<h3 style="font-size:13px">Claim level (${claimFlags.length})</h3>` + claimFlags.map(flagCard).join('') : '') +
    (record.unchecked_check_ids.length ? `<p class="hint">Unchecked checks (no claims): ${record.unchecked_check_ids.map(esc).join(', ')}</p>` : '') +
    (record.pending_standards.length ? `<p class="hint">Pending company standards: ${record.pending_standards.map((p) => esc(p.check_id)).join(', ')}</p>` : '');
  const evidenceByClaim = {};
  record.evidence.forEach((e) => { (evidenceByClaim[e.claim_id] = evidenceByClaim[e.claim_id] || []).push(e); });
  $('tab-claims').innerHTML = record.claims.length ? '<table><tr><th>Claim</th><th>Text</th><th>Evidence</th></tr>' + record.claims.map((c) =>
    `<tr><td>${esc(c.claim_id)}</td><td>${esc(c.text)}</td><td>${(evidenceByClaim[c.claim_id] || []).map((e) => `<div><span class="chip">${esc(e.relation)}</span> ${e.unit_id ? esc(e.unit_id) + ': ' + esc(e.quote) : ''}</div>`).join('')}</td></tr>`).join('') + '</table>'
    : '<p class="hint">No claims were extracted.</p>';
  $('tab-runs').innerHTML = '<table><tr><th>Run</th><th>Status</th><th>Flags before aggregation</th><th>Error</th><th>Elapsed</th></tr>' +
    record.runs.map((r) => `<tr><td>${r.run_index}</td><td>${esc(r.status)}</td><td>${r.flags.length}</td><td>${esc(r.error_code || '')}</td><td>${r.elapsed_seconds.toFixed(1)} s</td></tr>`).join('') + '</table>' +
    `<p class="hint">Rubric ${esc(record.rubric.rubric_id)} ${esc(record.rubric.variant)} ${esc(record.rubric.version)} · tools ${record.tools_enabled} · verify ${record.verify_enabled} · human_status ${esc(record.human_status)}</p>`;
  $('json').textContent = JSON.stringify(record, null, 2);
  showTab('text');
}

function showTab(name) {
  document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('active', b.dataset.tab === name));
  document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('active', t.id === `tab-${name}`));
}
$('tabs').addEventListener('click', (e) => { if (e.target.dataset.tab) showTab(e.target.dataset.tab); });

document.addEventListener('click', (e) => {
  const mark = e.target.closest('mark[data-flags]');
  if (mark) {
    showTab('flags');
    const first = document.querySelector(`.flag[data-flag="${mark.dataset.flags.split(',')[0]}"]`);
    if (first) { first.scrollIntoView({behavior: 'smooth', block: 'center'}); first.style.outline = '2px solid var(--accent)'; setTimeout(() => (first.style.outline = ''), 1500); }
    return;
  }
  const card = e.target.closest('.flag[data-flag]');
  if (card) {
    const target = document.querySelector(`mark[data-flags~="${card.dataset.flag}"], mark[data-flags*="${card.dataset.flag},"], mark[data-flags$="${card.dataset.flag}"]`);
    if (target) { showTab('text'); target.scrollIntoView({behavior: 'smooth', block: 'center'}); target.classList.add('pulse'); setTimeout(() => target.classList.remove('pulse'), 1500); }
  }
});

async function loadRecords() {
  const result = await api('/records?limit=30');
  if (!result.ok) return;
  $('records').innerHTML = result.body.map((r) =>
    `<li data-id="${esc(r.review_id)}"><span class="badge ${r.provenance}">${esc(r.provenance)}</span> <span class="badge ${r.status}">${esc(r.status)}</span> ${esc(r.created_at.slice(0, 19).replace('T', ' '))} · ${r.flag_count} flags · ${r.elapsed_seconds.toFixed(0)} s</li>`).join('') || '<li class="hint">No records yet.</li>';
}
$('records').addEventListener('click', async (e) => {
  const item = e.target.closest('li[data-id]');
  if (!item) return;
  const result = await api(`/records/${item.dataset.id}`);
  if (result.ok) { render(result.body); $('report').value = result.body.report; updateCharInfo(); }
});

updateCharInfo();
loadRecords();
</script>
</body>
</html>
