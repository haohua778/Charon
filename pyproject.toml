[project]
name = "charon"
version = "0.1.0"
description = "A fixed-DAG report-review prototype with reproducible offline evaluation."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "langgraph==1.2.11",
    "openai==3.16.2",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "uvicorn>=0.35,<1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
